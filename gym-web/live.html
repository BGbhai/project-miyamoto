<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Miyamoto Live</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta
      name="description"
      content="Fresh entrypoint for the latest Project Miyamoto weekly workout board."
    />
    <meta name="theme-color" content="#10231d" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260405d" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (async function () {
        const build = "20260405d";
        const url = new URL(location.href);
        localStorage.setItem("miyamoto:build", build);

        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          if (registrations.length) {
            await Promise.all(
              registrations.map((registration) =>
                registration.unregister().catch(() => undefined),
              ),
            );
          }
        }

        if ("caches" in window) {
          const cacheKeys = await caches.keys();
          const staleKeys = cacheKeys.filter((name) => /miya|miyamoto/i.test(name));
          if (staleKeys.length) {
            await Promise.all(staleKeys.map((name) => caches.delete(name)));
          }
        }

        if (url.searchParams.get("refresh") !== build) {
          url.searchParams.set("refresh", build);
          location.replace(url.toString());
        }
      })();
    </script>
    <script type="module" src="./app.js?v=20260405d"></script>
  </body>
</html>
